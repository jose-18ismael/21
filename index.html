<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Ti</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Canvas de partículas de fondo (Galaxia) -->
  <canvas id="galaxyCanvas"></canvas>

  <!-- Elemento central (Corazón / Espiral) -->
  <div class="center-heart">
    <div class="glowing-heart"></div>
    <span class="center-text">Te amo 🌻</span>
  </div>

  <!-- Elementos flotantes (Flores y Frases) -->
  <div class="floating-elements-container" id="floatingContainer"></div>

  <section class="bottom-message" aria-label="Aviso de derechos de autor">
    <p class="copyright-notice">Derecho de autor · Se eliminará en 48 horas</p>
  </section>

  <!-- Carta / Modal de mensaje -->
  <div class="modal-overlay" id="letterModal">
    <div class="modal-card">
      <h2 class="modal-title">Mi amor</h2>
      <p class="modal-body">
        Estas flores amarillas son como tú: brillantes, radiantes y llenas de alegría.<br><br>
        Gracias por iluminar cada uno de mis días. Eres simplemente hermosa.
      </p>
      <div class="modal-signature">Te Amo Mucho</div>
      <button class="modal-btn" onclick="closeModal()">Para Ti 🌻</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
